# Girder alignment tool - site configuration for ONE build bay.
#
# This is a TEMPLATE. Copy this directory into a service in a *-services repo
# (e.g. deb-services/services/ts01c-girder-align/config/) where it becomes a
# ConfigMap mounted at /epics/ioc/config, which is where the application looks
# by default. Nothing here ships with the Python package.
#
# The tool NEVER commands motion. Its one write is the encoder zero below,
# which sets a measurement datum in the IOC and is persisted by autosave.
#
# One deployment serves ONE build bay. The bay is selected by `epics.domain`,
# so the container image is identical for every bay.

epics:
  # Technical-area domain for THIS bay's encoder rig. This is the per-bay knob.
  #   bay 1 -> TS01C, bay 2 -> TS02C, ...
  # Override at deploy time with the GIRDER_DOMAIN environment variable.
  domain: TS01C

  # Device name within the domain. A PV is "<domain>-<encoder_device>:<suffix>".
  encoder_device: AL-GIRDR-01

  # Encoder id -> PV suffix. The eight ids are fixed by the geometry model and
  # must all be present.
  pv_map:
    V_US_IN:   "US:Y_IB"
    V_US_OUT:  "US:Y_OB"
    V_DS_IN:   "DS:Y_IB"
    V_DS_OUT:  "DS:Y_OB"
    SURGE_US:  "US:Z"
    SWAY_US:   "US:X"
    SURGE_DS:  "DS:Z"
    SWAY_DS:   "DS:X"

  # Zeroing. "Zero encoders" in the UI writes 0 to <pv><zero_setpoint_suffix>
  # and then processes <pv><zero_process_suffix>; the IOC computes the offset
  # and autosave persists it. This is a hardware datum, not a display offset,
  # and it is not undoable from the tool.
  zero_setpoint_suffix: "_SP"
  zero_process_suffix: "_ZCALC.PROC"

  # Optional per-encoder engineering-unit scaling (counts -> mm).
  scale: {}

# ---------------------------------------------------------------------------
# Room air temperature.
#
# The sensors do NOT follow the encoder domain convention - they are one array
# covering the whole hall and all of them sit under TS01C. Each bay therefore
# gets an explicit list of FULL PV names for the sensors nearest to it, and the
# lists overlap between bays.
#
# Readings are recorded with each survey for provenance. They are not used for
# any thermal compensation.
# ---------------------------------------------------------------------------
temperature:
  sensor_pvs:
    - "TS01C-EA-GIRDR-01:TMON01"
    - "TS01C-EA-GIRDR-01:TMON02"
    - "TS01C-EA-GIRDR-01:TMON03"

  # Flag the average as degraded if the sensors disagree by more than this.
  # The hall is held to +/-0.5 C.
  max_spread_c: 0.5

gate:
  default_mm: 0.010             # per-encoder "on target" gate
  encoder_resolution_mm: 0.001  # the gate is never allowed finer than this

paths:
  # The serial -> girder type table. Relative to THIS file, so the two travel
  # together in one ConfigMap. Defaults to girder_serials.csv beside this file.
  serials: girder_serials.csv

  # Writable locations. The config directory is a read-only ConfigMap mount, so
  # in a deployment set these to somewhere writable - normally by environment
  # (GIRDER_SESSIONS_DB / GIRDER_REPORTS), which overrides whatever is here.
  # Relative paths are resolved against the working directory, not this file.
  sessions_db: sessions/sessions.sqlite
  reports: reports

  # Directory holding <type>_bare_girder.obj/.mtl/.stl for the optional 3D
  # view. The models are ~79 MB so they are NOT shipped in the package or the
  # image; point this at a mounted volume to enable the 3D view. When it is
  # empty or missing, the plan and end views (pure SVG) still work and the 3D
  # view falls back to a plain envelope box.
  models: ""

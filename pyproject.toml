[build-system]
requires = ["setuptools>=64", "setuptools_scm[toml]>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "dls-deb-girder-alignment"
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
description = "Tool to facilitate alignment of girders in the deb"
dependencies = [
    "cothread",   # Channel Access. Linux only, which is fine: this runs in k8s.
    # cothread ships no libca of its own: it looks for epicscorelibs, then for
    # $EPICS_BASE. Without this the container has no CA library at all and
    # every deployment silently falls back to the simulator.
    "epicscorelibs",
    "flask",
    "numpy",
    "pyyaml",
    "reportlab",  # PDF report, including the plan/end drawings
    "waitress",   # production WSGI server; Flask's own is dev-only
]
dynamic = ["version"]
license.file = "LICENSE"
readme = "README.md"
# Upper bound is cothread: 2.20.1 is its latest release, it classifies no
# further than 3.12, and on 3.14 `import cothread` is a fatal stack overflow in
# its coroutine bootstrap - not an exception, an interpreter crash. It does work
# on 3.13. The container builds on 3.11 (.python-version), so this bound costs
# the deployment nothing; lift it when cothread supports 3.14.
requires-python = ">=3.14,<3.15"

[dependency-groups]
dev = [
    "pre-commit",
    "pyright",
    "pytest",
    "pytest-cov",
    "ruff",
    "tox-uv",
    "types-mock",
]

[project.scripts]
dls-deb-girder-alignment = "dls_deb_girder_alignment.__main__:main"

[project.urls]
GitHub = "https://github.com/DiamondLightSource/dls-deb-girder-alignment"

[[project.authors]] # Further authors may be added by duplicating this section
email = "lee.hudson@diamond.ac.uk"
name = "Lee Hudson"

[tool.setuptools_scm]
version_file = "src/dls_deb_girder_alignment/_version.py"

[tool.setuptools.package-data]
# Only the UI ships with the package. Site configuration does NOT - see
# example/config/ and the module docstring in config.py. Neither do the 3D
# girder models: they are ~79 MB, so they are mounted at runtime and the viewer
# falls back to an envelope box without them (see paths.models).
dls_deb_girder_alignment = ["static/*.html"]

[tool.pyright]
# "basic", not "strict": this package is mostly numerical code ported from a
# working tool, and numpy's typing makes strict mode noise rather than signal.
typeCheckingMode = "basic"
reportMissingImports = false # Ignore missing stubs in imported modules

[tool.pytest.ini_options]
# Run pytest with all our checkers, and don't spam us with massive tracebacks on error
addopts = """
    --tb=native -vv
    """
# https://iscinumpy.gitlab.io/post/bound-version-constraints/#watch-for-warnings
filterwarnings = "error"
# Doctest python code in docs, python code in src docstrings, test functions in tests
testpaths = "src tests"

[tool.coverage.run]
patch = ["subprocess"]
data_file = "/tmp/dls_deb_girder_alignment.coverage"

[tool.coverage.paths]
# Tests are run from installed location, map back to the src directory
source = ["src", "**/site-packages/"]

[tool.tox]
skipsdist = true
# envs to runs automatically with tox -p
env_list = ["pre-commit", "type-checking", "tests"]

[tool.tox.env_run_base]
# Pass all environment variables to the test environments
passenv = ["*"]

[tool.tox.env.pre-commit]
description = "Run pre-commit on all files"
commands = [
    [
        "pre-commit",
        "run",
        "--all-files",
        "--show-diff-on-failure",
        { replace = "posargs", default = [
        ], extend = true },
    ],
]

[tool.tox.env.type-checking]
description = "Run pyright"
commands = [
    [
        "pyright",
        "--pythonpath",
        "{env:VIRTUAL_ENV}/bin/python",
        "src",
        "tests",
        { replace = "posargs", default = [
        ], extend = true },
    ],
]

[tool.tox.env.tests]
description = "Run tests with coverage"
commands = [
    [
        "pytest",
        "--cov=dls_deb_girder_alignment",
        "--cov-report",
        "term",
        "--cov-report",
        "xml:cov.xml",
        { replace = "posargs", default = [
        ], extend = true },
    ],
]

[tool.ruff]
src = ["src", "tests"]
line-length = 88
lint.select = [
    "B",   # flake8-bugbear - https://docs.astral.sh/ruff/rules/#flake8-bugbear-b
    "C4",  # flake8-comprehensions - https://docs.astral.sh/ruff/rules/#flake8-comprehensions-c4
    "E",   # pycodestyle errors - https://docs.astral.sh/ruff/rules/#error-e
    "F",   # pyflakes rules - https://docs.astral.sh/ruff/rules/#pyflakes-f
    "N",   # pep8-naming - https://docs.astral.sh/ruff/rules/#pep8-naming-n
    "W",   # pycodestyle warnings - https://docs.astral.sh/ruff/rules/#warning-w
    "I",   # isort - https://docs.astral.sh/ruff/rules/#isort-i
    "UP",  # pyupgrade - https://docs.astral.sh/ruff/rules/#pyupgrade-up
    "SLF", # self - https://docs.astral.sh/ruff/settings/#lintflake8-self
]
lint.ignore = [
    # This package aliases modules by a single capital, following the notation
    # of the maths it implements: G for geometry, R for report, MM for
    # reportlab's millimetre unit. It is a deliberate convention, applied
    # consistently, and spelling them out makes the formulae harder to read.
    "N812",
]

[tool.ruff.lint.per-file-ignores]
# By default, private member access is allowed in tests
# See https://github.com/DiamondLightSource/python-copier-template/issues/154
# Remove this line to forbid private member access in tests
"tests/**/*" = ["SLF001"]
# The maths modules follow the notation of the geometry they implement: J is the
# Jacobian, ata/atb are the normal-equation terms. Renaming them to satisfy
# pep8-naming would make them harder to check against the derivation.
"src/dls_deb_girder_alignment/geometry.py" = ["N803", "N806"]
# Drawing locals mirror reportlab's own naming (Drawing, Line, String, ...).
"src/dls_deb_girder_alignment/report.py" = ["N806"]
"src/dls_deb_girder_alignment/_geom_data.py" = ["E501"]
